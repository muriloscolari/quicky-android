# Gradle maximum machine utilization (16 CPU threads, 23GB RAM)
org.gradle.jvmargs=-Xmx6g -Xms1g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
org.gradle.workers.max=16

# Kotlin & Android R8 full performance optimizations
kotlin.code.style=official
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
